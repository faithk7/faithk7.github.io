sass:
  sass_dir: assets
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-paginate

collections:
  sass_dir:
    output: true
  notes:
    output: true
  posts:
    output: true

feed:
  path: feed.xml
  custom_path: _includes/custom_feed.xml

paginate: 1 # Number of posts per page
paginate_path: "/page:num/" # Path format for pagination