<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <nav class="c-navbar">
        <div class="c-navbar-container" data-theme="">
            <ul class="c-navbar-items">
                <li class="o-navbar-item"><a data-theme="" href="{{ '/' | relative_url }}" title="Home">Home</a>
                    <button id="dark-mode-toggle" class="o-setting-icon" aria-label="Toggle dark mode">
                        {% include svg_html/dark_mode_toggle.html %}
                    </button>
                    <a href="/feed.xml" class="o-setting-icon" aria-label="RSS feed">
                        {% include svg_html/rss.html %}
                    </a>
                    <!-- </div> -->
                </li>
                <li class="o-navbar-item"><a data-theme="" href="{{ '/note' | relative_url }}" title="Note">Note</a>
                </li>
                <li class="o-navbar-item"><a data-theme="" href="{{ '/writing-index' | relative_url }}"
                        title="Writing">Writing</a></li>
                <li class="o-navbar-item"><a data-theme="" href="{{ '/collect' | relative_url }}"
                        title="Collect">Collect</a>
                </li>
                <li class="o-navbar-item"><a data-theme="" href="{{ '/about' | relative_url }}" title="About">About</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="c-navbar-icon" id="nav-toggle">
        {% include svg_html/menu.html %}
    </div>

    <script>
        // Function to apply the light/dark mode
        function applyMode(mode) {
            const elements = [
                document.body,
                ...document.querySelectorAll('.l-left, .l-center, .l-right, .c-navbar, .c-line, .o-navbar-item a, .o-tag')
            ];

            elements.forEach(el => {
                el.setAttribute('data-theme', mode);
            });

            // Update any other elements that might have data-theme
            document.querySelectorAll('[data-theme]').forEach(el => {
                el.setAttribute('data-theme', mode);
            });
        }


        // TODO: refactor
        // Check for saved mode in local storage
        const savedMode = localStorage.getItem('mode');
        if (savedMode) {
            applyMode(savedMode);
        }

        // Toggle dark mode
        const toggleButton = document.getElementById('dark-mode-toggle');
        toggleButton.addEventListener('click', () => {
            const currentMode = document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
            const newMode = currentMode === 'light' ? 'dark' : 'light';
            applyMode(newMode);
            localStorage.setItem('mode', newMode);
        });

        document.addEventListener("DOMContentLoaded", function () {
            const navToggle = document.getElementById('nav-toggle');
            const navbar = document.querySelector('.c-navbar');
            const overlay = document.createElement('div');
            overlay.className = 'c-navbar-overlay';
            document.body.appendChild(overlay);

            navToggle.addEventListener('click', function () {
                navbar.classList.toggle('show');
                // overlay.classList.toggle('show');
            });

            overlay.addEventListener('click', function () {
                navbar.classList.remove('show');
            });

            navbar.addEventListener('click', function () {
                navbar.classList.remove('show');
            });
        });
    </script>

</body>

</html>
