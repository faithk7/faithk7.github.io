<!DOCTYPE html>
<html lang="en" data-theme="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <!-- Prevent FOUC: Apply saved theme before render -->
    <script>
        (function () {
            const savedMode = localStorage.getItem('mode');
            if (savedMode) {
                document.documentElement.setAttribute('data-theme', savedMode);
            }
        })();
    </script>
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/stylesheets/main.css' | relative_url }}">
    <!-- Favicon after CSS -->
    <link id="favicon" rel="icon" href="/assets/site-logo.png" type="image/png">
    <title>{{ page.title }}</title>
</head>

<body>
    <div class="l-container">
        <div class="l-grid l-left">
            <!-- Left empty space (3 parts) -->
        </div>
        <div class="l-grid l-center">
            <!-- Main content (6 parts) -->
            {{ content }}
        </div>
        <div class="l-grid l-right">
            <!-- Navbar (3 parts) -->
            {% include nav.html %}
        </div>
    </div>

    <!-- All JavaScript moved to bottom for better performance -->
    <script async>
        // Favicon handling
        document.addEventListener('DOMContentLoaded', function () {
            const favicon = document.getElementById('favicon');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

            function updateFavicon() {
                if (prefersDark.matches) {
                    favicon.href = '/assets/site-logo.png'; // Light favicon for dark theme
                } else {
                    favicon.href = '/assets/site-logo-dark-font.png'; // Dark favicon for light theme
                }
            }

            // Initial check
            updateFavicon();

            // Listen for changes in theme preference
            prefersDark.addEventListener('change', updateFavicon);
        });
    </script>
</body>

</html>
