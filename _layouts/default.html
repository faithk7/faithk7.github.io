<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- DNS Prefetch & Preconnect for external resources -->
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://instant.page">
    <link rel="dns-prefetch" href="https://ipapi.co">
    <link rel="dns-prefetch" href="https://bk7.k7m.xyz">
    <link rel="dns-prefetch" href="https://nk7.k7m.xyz">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://bk7.k7m.xyz" crossorigin>
    <link rel="preconnect" href="https://nk7.k7m.xyz" crossorigin>
    {% seo %}
    {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    {% if page.head_include %}
    {% include {{ page.head_include }} %}
    {% endif %}
    <script>
        (function () {
            const savedMode = localStorage.getItem('mode');
            if (savedMode) {
                document.documentElement.setAttribute('data-theme', savedMode);
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ '/stylesheets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link id="favicon" rel="icon" href="/assets/site-logo.png" type="image/png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Kai Qu",
      "url": "https://k7y.space",
      "image": "https://k7y.space/assets/site-logo.png",
      "jobTitle": "Software Engineer",
      "worksFor": {
        "@type": "Organization",
        "name": "Baidu"
      },
      "sameAs": [
        "https://github.com/faithk7",
        "https://www.linkedin.com/in/kqu1106/",
        "https://k7y.space/cv",
        "https://www.kaggle.com/faithk7u"
      ],
      "description": "Software engineer based in Beijing, China. Loves reading, running and watching anime.",
      "nationality": {
        "@type": "Country",
        "name": "China"
      },
      "alumniOf": [
        {
          "@type": "CollegeOrUniversity",
          "name": "University of Virginia"
        }
      ]
    }
    </script>

</head>

<body data-page="{{ page.url }}" data-layout="{{ page.layout }}">
    <div class="l-container">
        <div class="l-grid l-left">
        </div>
        <div class="l-grid l-center">
            {{ content }}
        </div>
        <div class="l-grid l-right">
            {% include nav.html %}
        </div>
    </div>

    <script src="/assets/js/main.js?v={{ site.time | date: '%s' }}" defer></script>

    <script src="https://instant.page/5.2.0" type="module"
        integrity="sha384-jnZyxPjiipYXnSU0ygqeac2q7CVYMbh84q0uHVRRxEtvFPiQYbXWUorga2aqZJ0z" crossorigin="anonymous"></script>
</body>

</html>
