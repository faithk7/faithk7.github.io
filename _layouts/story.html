<!doctype html>
<html lang="{{ page.lang | default: site.lang | escape }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://open-heart.lastk7.workers.dev">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="Kai Qu's writing" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" href="/assets/site-logo.png" type="image/png">
    <link href="/stylesheets/main.css?v={{ site.time | date: '%s' }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro&display=swap" rel="stylesheet">
</head>

<body class="col-{{ page.collection }}" data-page-type="{{ page.type }}">
    <header class="story-header smol">
        <div class="story-meta">
            <a href="/" aria-label="Home">&leftarrow;</a>
            <h1 class="text entry-title">
                {{ page.title | escape }}, {{ page.date | date: "%Y/%m/%d %H:%M" }}
            </h1>
            <open-heart class="text-open-heart monospace"
                href="https://open-heart.lastk7.workers.dev/?id={{ page.url }}" emoji="❤️"
                aria-labelledby="like-prompt">
                (<span class="on">Liked ♥︎.</span><span class="off">Like?</span>)
            </open-heart>
        </div>
        <div>
            {{ page.caption }}
        </div>
    </header>
    <main>
        {% if page.image %}
        {% assign story_image = page.image.path | default: page.image %}
        <img src="{{ story_image | escape }}" alt="{{ page.alt | strip | escape }}" class="story-image" decoding="async"{% if page.image.width and page.image.height %} width="{{ page.image.width }}" height="{{ page.image.height }}"{% endif %}>
        {% endif %}
    </main>

    <script defer type="module" src="https://unpkg.com/open-heart-element@latest" crossorigin="anonymous"></script>
</body>

</html>
