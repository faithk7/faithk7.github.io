---
layout: default
---

<nav class="toc-container" role="navigation" aria-label="Table of Contents">
    {% include toc.html html=content class="toc-list" %}
</nav>

<article class="c-writing-post-meta-container">
    <header>
        <h1 class="o-writing-post-title">{{ page.title | replace: "| Kai Qu", "" }}</h1>
        <time class="c-writing-post-date" datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%B %d, %Y" }}
        </time>
        <div class="c-writing-post-tag-container">
            {% for tag in page.tags %}
            <span class="o-writing-post-tag" data-theme="light">{{ tag }}</span>
            {% unless forloop.last %}<span class="o-writing-post-tag-separator"> / </span>{% endunless %}
            {% endfor %}
        </div>
    </header>
    <div class="c-writing-post-container">
        <div class="o-writing-post-text" data-theme="light">
            {{ content }}
        </div>
    </div>
</article>

<!-- JavaScript moved to bottom -->
<script defer>
    // Initialize when DOM is ready
    document.addEventListener("DOMContentLoaded", function () {
        // Constants
        var SCROLL_OFFSET = 5; // Fixed 5px offset from viewport top
        var SCROLL_ANIMATION_DURATION = 600; // ms
        
        // Cache DOM queries
        var postTextLinks = document.querySelectorAll('.o-writing-post-text a');
        var scrollContainer = document.querySelector('.l-center');
        
        // Open all links in .o-writing-post-text in a new tab
        postTextLinks.forEach(function (link) {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        });

        // Smooth scroll with offset for TOC links; use delegation for reliability
        var isScrolling = false;

        /**
         * Parse URL hash from href attribute
         * @param {string} href - The href attribute value
         * @returns {string|null} - The hash part or null
         */
        function parseHash(href) {
            try {
                var url = new URL(href, location.href);
                return url.pathname === location.pathname ? url.hash : null;
            } catch (_) {
                var hashIndex = href.indexOf('#');
                return hashIndex >= 0 ? href.slice(hashIndex) : null;
            }
        }

        /**
         * Scroll to element by hash
         * @param {string} hash - The hash to scroll to
         */
        function scrollToHash(hash) {
            if (isScrolling || !scrollContainer) return;

            var id = (hash || '').replace(/^#/, '');
            if (!id) return;
            
            var target = document.getElementById(decodeURIComponent(id));
            if (!target) return;

            isScrolling = true;

            // Calculate target position relative to scroll container
            var targetRect = target.getBoundingClientRect();
            var containerRect = scrollContainer.getBoundingClientRect();
            var targetPosition = scrollContainer.scrollTop + (targetRect.top - containerRect.top) - SCROLL_OFFSET;
            
            // Use scrollTo for smooth scrolling
            scrollContainer.scrollTo({
                top: targetPosition,
                behavior: 'smooth'
            });

            // Reset the scrolling flag after animation completes
            setTimeout(function () {
                isScrolling = false;
            }, SCROLL_ANIMATION_DURATION);
        }

        // Handle TOC link clicks
        document.addEventListener('click', function (e) {
            var link = e.target && e.target.closest && e.target.closest('.toc-container a[href*="#"]');
            if (!link) return;
            
            var href = link.getAttribute('href') || '';
            var hash = parseHash(href);
            
            if (!hash) return;
            
            // Only prevent default if target exists on this page
            var id = hash.replace(/^#/, '');
            var target = document.getElementById(decodeURIComponent(id));
            if (!target) return;
            
            e.preventDefault();
            scrollToHash(hash);
            
            // Update URL without jumping
            if (history && history.replaceState) {
                history.replaceState(null, '', hash);
            } else {
                location.hash = hash;
            }
        });

        // Handle direct hash on load and hash changes
        if (location.hash) {
            setTimeout(function () { scrollToHash(location.hash); }, 0);
        }
        window.addEventListener('hashchange', function () { 
            scrollToHash(location.hash); 
        });
    });
</script>
