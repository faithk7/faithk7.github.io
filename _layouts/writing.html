---
layout: default
---

<head>
    <!-- Meta tags first -->
    <title>{{ page.title }}</title>
</head>

{% include toc.html html=content class="toc-container" %}

<div class="c-writing-post-meta-container">
    <h1 class="o-writing-post-title">{{ page.title | replace: "| Kai Qu", "" }}</h1>
    <div class="c-writing-post-date" data-theme="">{{ page.date | date: "%B %d, %Y" }}</div>
    <div class="c-writing-post-tag-container">
        {% for tag in page.tags %}
        <span class="o-writing-post-tag" data-theme="light">{{ tag }}</span>
        {% unless forloop.last %}<span style="margin-left: 2px; margin-right: 2px;"> / </span>{% endunless %}
        {% endfor %}
    </div>
    <div class="o-writing-post-text" data-theme="light">
        {{ content }}
    </div>
</div>

<!-- JavaScript moved to bottom -->
<script defer>
    // Initialize when DOM is ready
    document.addEventListener("DOMContentLoaded", function () {
        // Open all links in .o-writing-post-text in a new tab
        document.querySelectorAll('.o-writing-post-text a').forEach(function (link) {
            link.setAttribute('target', '_blank');
        });

        // Handle smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);
                const scrollContainer = document.querySelector('.l-grid.l-center.light');

                if (targetElement && scrollContainer) {
                    const elementRect = targetElement.getBoundingClientRect();
                    const containerRect = scrollContainer.getBoundingClientRect();
                    const absoluteElementTop = elementRect.top + scrollContainer.scrollTop - containerRect.top;

                    // Calculate the maximum scroll position to prevent overflow
                    const maxScrollTop = scrollContainer.scrollHeight - containerRect.height;
                    const targetScrollTop = Math.min(absoluteElementTop, maxScrollTop);

                    scrollContainer.scrollTo({
                        top: targetScrollTop,
                        behavior: 'smooth'
                    });
                }
            });
        });
    });
</script>
