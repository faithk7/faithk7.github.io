---
layout: default
---

<head>
    <link rel="stylesheet" href="{{ '/assets/writing.css' | relative_url }}">
</head>

<div class="c-writing-post-meta-container">
    <h1 class="o-writing-post-title">{{ page.title }}</h1>
    <div class="c-writing-post-date">{{ page.date | date: "%B %d, %Y" }}</div>
    <div class="c-writing-post-tag-container">
        {% for tag in page.tags %}
        <span class="o-writing-post-tag" data-theme="light"><i>{{ tag }}</i></span>
        {% unless forloop.last %}<span style="margin-left: 2px; margin-right: 2px;"> / </span>{% endunless %}
        {% endfor %}
    </div>
    <div class="o-writing-post-text" data-theme="light">
        {{ content }}
    </div>
</div>


<script>
    // open all links in .o-writing-post-text in a new tab
    document.addEventListener("DOMContentLoaded", function () {
        var links = document.querySelectorAll('.o-writing-post-text a');
        links.forEach(function (link) {
            link.setAttribute('target', '_blank');
        });
    });
</script>
