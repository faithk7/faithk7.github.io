---
layout: default
---

{% include toc.html html=content class="toc-container" %}

<div class="c-writing-post-meta-container">
    <h1 class="o-writing-post-title">{{ page.title | replace: "| Kai Qu", "" }}</h1>
    <div class="c-writing-post-date">{{ page.date | date: "%B %d, %Y" }}</div>
    <div class="c-writing-post-tag-container">
        {% for tag in page.tags %}
        <span class="o-writing-post-tag" data-theme="light">{{ tag }}</span>
        {% unless forloop.last %}<span class="o-tag-separator"> / </span>{% endunless %}
        {% endfor %}
    </div>
    <div class="c-writing-post-container">
        <div class="o-writing-post-text" data-theme="light">
            {{ content }}
        </div>
    </div>
</div>

<script defer>
    document.addEventListener("DOMContentLoaded", function () {
        // Optimize image loading for writing posts
        var images = document.querySelectorAll('.o-writing-post-text img');
        images.forEach(function (img, index) {
            img.setAttribute('decoding', 'async');
        });

        document.querySelectorAll('.o-writing-post-text a[href]').forEach(function (link) {
            try {
                var url = new URL(link.getAttribute('href'), location.href);
                if (url.origin === location.origin) return;
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            } catch (_) {
            }
        });

        var isScrolling = false;
        var updateActiveTocLink = null;

        function scrollToHash(hash) {
            if (isScrolling) return;

            var normalizedHash = '';
            try {
                normalizedHash = decodeURIComponent(hash || '');
            } catch (_) {
                normalizedHash = hash || '';
            }

            var id = normalizedHash.replace(/^#/, '');
            if (!id) return;
            var target = document.getElementById(id);
            if (!target) return;

            isScrolling = true;

            // Wait for any images/content to load and layout to stabilize
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    try {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    } catch (e) {
                        // Fallback for older browsers
                        target.scrollIntoView(true);
                    }

                    setTimeout(function () {
                        isScrolling = false;
                        if (updateActiveTocLink) updateActiveTocLink();
                    }, 800);
                });
            });
        }

        document.addEventListener('click', function (e) {
            var link = e.target && e.target.closest && e.target.closest('.toc-container a[href*="#"]');
            if (!link) return;
            
            e.preventDefault();
            e.stopPropagation();
            
            var href = link.getAttribute('href') || '';
            try {
                var url = new URL(href, location.href);
                if (url.pathname !== location.pathname) return;
                var hash = url.hash;
            } catch (_) {
                var hash = href.indexOf('#') >= 0 ? href.slice(href.indexOf('#')) : '';
            }
            if (!hash) return;
            var id = hash.replace(/^#/, '');
            var target = document.getElementById(decodeURIComponent(id));
            if (!target) return;
            
            scrollToHash(hash);
            if (history && history.replaceState) {
                history.replaceState(null, '', hash);
            } else {
                location.hash = hash;
            }
        });

        if (location.hash) {
            setTimeout(function () { scrollToHash(location.hash); }, 0);
        }
        window.addEventListener('hashchange', function () { scrollToHash(location.hash); });

        var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.toc-container a[href*="#"]'));
        var tocById = {};
        tocLinks.forEach(function (link) {
            var hash = '';
            try {
                hash = new URL(link.getAttribute('href') || '', location.href).hash;
            } catch (_) {
                var href = link.getAttribute('href') || '';
                hash = href.indexOf('#') >= 0 ? href.slice(href.indexOf('#')) : '';
            }
            var id = decodeURIComponent(hash.replace(/^#/, ''));
            if (id) tocById[id] = link;
        });

        function setActiveTocLink(id) {
            tocLinks.forEach(function (link) {
                link.classList.toggle('is-active', link === tocById[id]);
            });
        }

        if (tocLinks.length) {
            var headings = Object.keys(tocById).map(function (id) {
                return document.getElementById(id);
            }).filter(Boolean);

            var scrollRoot = document.querySelector('.l-center');

            updateActiveTocLink = function () {
                if (!headings.length) return;

                var rootRect = scrollRoot ? scrollRoot.getBoundingClientRect() : { top: 0, height: window.innerHeight };
                var readingLine = rootRect.top + Math.min(rootRect.height * 0.22, 180);
                var currentHeading = headings[0];

                headings.forEach(function (heading) {
                    if (heading.getBoundingClientRect().top <= readingLine) {
                        currentHeading = heading;
                    }
                });

                if (currentHeading && currentHeading.id) {
                    setActiveTocLink(currentHeading.id);
                }
            };

            updateActiveTocLink();
            (scrollRoot || window).addEventListener('scroll', updateActiveTocLink, { passive: true });
            window.addEventListener('resize', updateActiveTocLink);
        }
    });
</script>
