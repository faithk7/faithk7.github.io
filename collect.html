---
layout: default
title: Collect
description: "Kai Qu's collect page"
---

<head>
    <!-- <link rel="stylesheet" href="{{ '/assets/collect.css' | relative_url }}"> -->
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <!-- Resource hints for navigation -->
    <link rel="prefetch" href="/" as="document">
    <link rel="prefetch" href="/note" as="document">
    <link rel="prefetch" href="/writing-index" as="document">
    <link rel="prefetch" href="/about" as="document">
    <!-- Preload critical resources for collect page -->
    <link rel="preload" href="{{ '/assets/js/collect.js' | relative_url }}" as="script">
    <!-- Use data attribute instead of global variable for better encapsulation -->
    <script id="collection-data" type="application/json">{{ site.data.collect | jsonify }}</script>
    <script src="{{ '/assets/js/collect.js' | relative_url }}" defer></script>
</head>

<div class="c-collection-container">
    <h1 class="o-collection-title">Collect</h1>
    <div class="c-collection-nav-container">
        <!-- Navigation items will be dynamically added here -->
    </div>
    <div class="c-collection-tile-container">
        <!-- Sections will be dynamically added here -->
    </div>
</div>
