---
layout: default
title: Collections
---

<head>
    <link rel="stylesheet" href="{{ '/assets/collection.css' | relative_url }}">
</head>

<div class="c-collection-container">
    <h1 class="o-collection-title">Collect</h1>
    <div class="c-collection-tile-container" id="collection-tiles">
        <!-- Sections will be dynamically added here -->
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const collectionTiles = document.getElementById('collection-tiles');
        const dataFiles = {{ site.data | jsonify
    }};

    for (const fileName in dataFiles) {
        if (dataFiles.hasOwnProperty(fileName)) {
            const section = document.createElement('div');
            section.className = 'c-collection-item-container';
            section.innerHTML = `<div class="o-collection-item">${fileName}</div>`;
            collectionTiles.appendChild(section);
        }
    }
    });
</script>
